plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'dev.starbridge'
version = mod_version
base { archivesName = 'starbridge-1.20.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods { starbridge { source sourceSets.main } }
        }
        client {
            workingDirectory project.file(project.findProperty('clientDir') ?: 'run-client')
            args '--username', (project.findProperty('clientName') ?: 'StarbridgeTester')
            if (project.hasProperty('voyageCrew')) {
                if (project.hasProperty('connect')) {
                    throw new GradleException('Cannot combine -PvoyageCrew with -Pconnect.')
                }
                property 'starbridge.voyageCrew', 'true'
            } else if (project.hasProperty('connect')) {
                args '--quickPlayMultiplayer', project.property('connect')
            }
        }
        server {
            workingDirectory project.file(project.findProperty('serverDir') ?: 'run-server')
            args '--nogui'
            if (project.hasProperty('voyageSmoke')) { property 'starbridge.voyageSmoke', 'true'; property 'starbridge.prototypeWorlds', 'true' }
            if (project.hasProperty('smokeTest')) property 'starbridge.smokeTest', 'true'
            if (project.hasProperty('smokePlayer')) property 'starbridge.smoke.requirePlayer', 'true'
            if (project.hasProperty('smokeLength')) property 'starbridge.smoke.length', project.property('smokeLength')
            if (project.hasProperty('smokeMachines')) property 'starbridge.smoke.machines', project.property('smokeMachines')
            if (project.hasProperty('smokeFePerTick')) property 'starbridge.smoke.fePerTick', project.property('smokeFePerTick')
        }
        gameTestServer {
            workingDirectory project.file(project.findProperty('gameTestDir') ?: 'run-gametest')
            property 'forge.enabledGameTestNamespaces', 'starbridge'
            property 'starbridge.prototypeWorlds', 'true'
            if (project.hasProperty('nativeGameTest')) property 'starbridge.nativeGameTest', 'true'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.squiddev.cc'; content { includeGroup 'cc.tweaked' } }
    flatDir { dirs 'runtime/mods'; content { includeGroup 'dev.starbridge.runtime' } }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_version}"
    compileOnly fg.deobf("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_version}")
    if (project.hasProperty('withComputer')) {
        runtimeOnly fg.deobf("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}")
    }
    if (project.hasProperty('withShips')) {
        runtimeOnly fg.deobf('dev.starbridge.runtime:valkyrienskies-120:2.4.11')
        runtimeOnly files('runtime/mods/kotlinforforge-4.11.0-all.jar')
    }
    if (project.hasProperty('withUnbound')) {
        runtimeOnly fg.deobf('dev.starbridge.runtime:unbound-forge-1.20.1:0.16.1')
        runtimeOnly fg.deobf('dev.starbridge.runtime:geckolib-forge-1.20.1:4.8.4')
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
processResources {
    from('pack/original-spaceflight.lock.json') { into 'META-INF/starbridge' }
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
jar {
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE.starbridge' } }
    manifest.attributes('MixinConfigs': 'starbridge.retrofit.mixins.json',
        'Specification-Title': 'Starbridge',
        'Specification-Vendor': 'Starbridge contributors',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version)
    finalizedBy 'reobfJar'
}

apply from: 'gradle/legacy-dock.gradle'
apply from: 'gradle/local-client.gradle'

// ForgeGradle can cache the 1.20.1 member mappings with obfuscated class owners.
// Such a map silently produces a development jar even though reobfJar succeeds.
tasks.named('createMcpToSrg') {
    outputs.upToDateWhen {
        File names = output.get().asFile
        names.isFile() && names.withReader('UTF-8') { reader ->
            reader.lines().anyMatch { it == 'net/minecraft/core/registries/Registries net/minecraft/core/registries/Registries' }
        }
    }
}

tasks.register('verifyProductionJar') {
    group = 'verification'
    dependsOn 'reobfJar'
    def archive = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(archive)
    def flightLock = file('pack/original-spaceflight.lock.json')
    inputs.file(flightLock)
    doLast {
        new java.util.zip.ZipFile(archive.get().asFile).withCloseable { zip ->
            def manifest = zip.getEntry('META-INF/starbridge/original-spaceflight.lock.json')
            if (manifest == null || !zip.getInputStream(manifest).withCloseable { Arrays.equals(it.readAllBytes(), flightLock.bytes) }) {
                throw new GradleException('The flight installation screen needs the same manifest as the distribution.')
            }
            def entry = zip.getEntry('dev/starbridge/Starbridge.class')
            def constants = zip.getInputStream(entry).withCloseable { new String(it.readAllBytes(), 'ISO-8859-1') }
            // Registries.CREATIVE_MODE_TAB must refer to its Forge 1.20.1 runtime field.
            if (!constants.contains('f_279569_') || constants.contains('CREATIVE_MODE_TAB')) {
                throw new GradleException('This JAR uses development registry names. Run createMcpToSrg --rerun, then build again.')
            }
        }
    }
}
tasks.named('build') { dependsOn 'verifyProductionJar' }
