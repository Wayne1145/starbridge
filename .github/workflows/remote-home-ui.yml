name: Remote home-port map

on:
  pull_request:
    paths:
      - '.github/workflows/remote-home-ui.yml'
      - 'qa/home-berths/**'
      - 'qa/remote-ui/**'
      - 'qa/navigation-calibration/hosted_originals.py'
      - 'tools/upstream_runtime_cache.py'
      - 'tools/upstream_runtime_region.py'
      - 'src/main/**'
      - 'pack/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:
    inputs:
      package_run:
        description: 'Successful Build and test run for this revision (optional)'
        required: false
        type: string
      parallel_wide:
        description: 'Use two survival clients and two 300-block original lunar approaches'
        type: boolean
        default: false
      parallel_profile:
        description: 'Record server thread samples during the two 300-block landings'
        type: boolean
        default: false

      parallel_reserve:
        description: 'Require both default VS storage previews to match the actual landing plots'
        type: boolean
        default: false
      parallel_preload:
        description: 'Warm the two known storage plots before the wide landing comparison'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
concurrency:
  group: home-port-gui-${{ github.event.pull_request.number || github.ref }}-${{ inputs.parallel_wide && 'parallel-wide' || 'return' }}
  cancel-in-progress: ${{ !inputs.parallel_wide }}

jobs:
  return:
    name: Home port · block, reselect and confirm
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare the display and software OpenGL
        timeout-minutes: 5
        run: |
          sudo apt-get -qq update
          sudo apt-get -y --no-install-recommends install xvfb xauth libgl1-mesa-dri libglx-mesa0 libxrandr2 libxcursor1 libxi6 libxinerama1
      - name: Compile the observation fixture
        if: ${{ !inputs.parallel_wide }}
        timeout-minutes: 30
        run: |
          ./gradlew -I qa/home-berths/fixture.init.gradle -I qa/home-berths/remote.init.gradle verifyProductionJar reobfHomeBerthQaJar --max-workers=2 --no-daemon --console=plain
          python -B qa/home-berths/test_remote.py -v
          python -B qa/home-berths/test_radar_replay.py -v
      - name: Compile the two-client landing observer
        if: ${{ inputs.parallel_wide }}
        timeout-minutes: 30
        run: |
          ./gradlew -I qa/concurrent-orbits/fixture.init.gradle -I qa/original-flight/fixture.init.gradle verifyProductionJar reobfConcurrentOrbitQaJar verifyOriginalQaJar --max-workers=2 --no-daemon --console=plain
      - name: Install the published game and Forge runtime
        timeout-minutes: 15
        run: python -B qa/remote-ui/smoke.py prepare --root "$RUNNER_TEMP/starbridge" --evidence "$RUNNER_TEMP/home-evidence"
      - name: Verify the published Starbridge package
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
          SOURCE_BASE: ${{ github.event.pull_request.base.sha }}
          REQUESTED_RUN: ${{ inputs.package_run }}
        run: python -B qa/remote-ui/package.py --directory "$RUNNER_TEMP/starbridge/package"
      - name: Confirm two 300-block landings from separate Chinese clients
        if: ${{ inputs.parallel_wide }}
        timeout-minutes: 37
        env:
          RECORD_SERVER: ${{ inputs.parallel_profile }}
          PRELOAD_STORAGE: ${{ inputs.parallel_preload }}
          RESERVE_STORAGE: ${{ inputs.parallel_reserve }}
        run: |
          flags=()
          if [[ "$RECORD_SERVER" == true ]]; then flags+=(--profile); fi
          if [[ "$PRELOAD_STORAGE" == true ]]; then flags+=(--preload); fi
          if [[ "$RESERVE_STORAGE" == true ]]; then flags+=(--reserve); fi
          python -B qa/concurrent-orbits/hosted_wide.py --root "$RUNNER_TEMP/starbridge" --evidence "$RUNNER_TEMP/home-evidence" --fixture build/qa/concurrent-orbits/starbridge-concurrent-qa.jar --flight-fixture build/qa/original-flight/starbridge-flight-fixture-1.0.0.jar "${flags[@]}"
      - name: Return from the Moon to an alternate berth on the home map
        if: ${{ !inputs.parallel_wide }}
        timeout-minutes: 17
        env:
          WIDE_LANDING: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          flags=()
          if [[ "$WIDE_LANDING" == true ]]; then flags+=(--wide); fi
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp +extension GLX' python -B qa/home-berths/remote.py --root "$RUNNER_TEMP/starbridge" --evidence "$RUNNER_TEMP/home-evidence" --fixture build/qa/home-berths/starbridge-home-berths-0.1.0.jar "${flags[@]}"
      - name: Verify seven rendered traffic states and the home landing
        if: ${{ !inputs.parallel_wide }}
        run: |
          python -m pip install --quiet --only-binary=:all: "Pillow==11.3.0"
          python -B qa/home-berths/replay_radar.py "$RUNNER_TEMP/home-evidence"
      - name: Save map frames, input and landing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.parallel_wide && 'parallel-wide-berths' || 'home-port-map' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/home-evidence/*.json
            ${{ runner.temp }}/home-evidence/*.png
            ${{ runner.temp }}/home-evidence/home-actions.txt
            ${{ runner.temp }}/home-evidence/wide-berths-saved-world.zip
            ${{ runner.temp }}/home-evidence/wide-berths-server.jfr
            ${{ runner.temp }}/home-evidence/assembly-storage.log
            ${{ runner.temp }}/home-evidence/server/
            ${{ runner.temp }}/home-evidence/OrbitCaptain/
            ${{ runner.temp }}/home-evidence/OrbitEngineer/
          if-no-files-found: warn
          retention-days: 7
