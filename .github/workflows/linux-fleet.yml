name: Hosted ten-player fleet

on:
  pull_request:
    paths:
      - '.github/workflows/linux-fleet.yml'
      - 'qa/linux-fleet/**'
      - 'qa/connected-fleet/src/**'
      - 'qa/concurrent-orbits/src/main/java/dev/starbridge/qa/fleet/**'
      - 'qa/remote-ui/runtime*'
      - 'qa/remote-ui/package.py'
      - 'tools/upstream_runtime_*.py'
      - 'qa/original-flight/inspect_deck.py'
      - 'src/main/**'
      - 'pack/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:
    inputs:
      package_run:
        description: 'Successful Build and test run for this revision (optional)'
        required: false
        type: string
      rehearse:
        description: 'Expand the same server from 10 to 20 to 30 connections with two minutes at each count'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
concurrency:
  group: linux-fleet-${{ github.event.pull_request.number || github.ref }}-${{ inputs.rehearse && 'rehearsal' || 'standard' }}
  cancel-in-progress: true

jobs:
  fleet:
    name: Complete pack 路 ten Forge connections on three ships
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && !inputs.rehearse && 185 || 75 }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare a display for the Forge connection process
        timeout-minutes: 5
        run: |
          sudo apt-get -qq update
          sudo apt-get -y --no-install-recommends install xvfb xauth libgl1-mesa-dri libglx-mesa0 libxrandr2 libxcursor1 libxi6 libxinerama1
      - name: Compile the observations and test the audit
        timeout-minutes: 15
        run: |
          ./gradlew -I qa/linux-fleet/fixture.init.gradle reobfLinuxFleetQaJar --max-workers=2 --no-daemon --console=plain
          python -B -m unittest discover -s qa/linux-fleet -p 'test_*.py' -v
      - name: Install the published game and Forge client runtime
        timeout-minutes: 15
        run: python -B qa/remote-ui/smoke.py prepare --root "$RUNNER_TEMP/starbridge" --evidence "$RUNNER_TEMP/fleet-evidence"
      - name: Verify the published Starbridge package
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
          SOURCE_BASE: ${{ github.event.pull_request.base.sha }}
          REQUESTED_RUN: ${{ inputs.package_run }}
        run: python -B qa/remote-ui/package.py --directory "$RUNNER_TEMP/starbridge/package"
      - name: Run the dedicated fleet and inspect its closed save
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && !inputs.rehearse && 150 || 40 }}
        env:
          TWO_HOURS: ${{ github.event_name == 'workflow_dispatch' && !inputs.rehearse }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          flags=()
          if [[ "$TWO_HOURS" == true ]]; then flags+=(--two-hours); fi
          if [[ "$REHEARSE" == true ]]; then flags+=(--rehearse); fi
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp +extension GLX' python -B qa/linux-fleet/run.py --root "$RUNNER_TEMP/starbridge" --evidence "$RUNNER_TEMP/fleet-evidence" --fixture build/qa/linux-fleet/starbridge-linux-fleet-qa-0.1.0.jar "${flags[@]}"
      - name: Save fleet evidence and diagnostic tails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.rehearse && 'linux-fleet-rehearsal' || 'linux-ten-fleet' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleet-evidence/
          if-no-files-found: warn
          retention-days: 7
