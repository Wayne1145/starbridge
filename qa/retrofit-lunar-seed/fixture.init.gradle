gradle.beforeProject { project ->
    project.pluginManager.withPlugin('net.minecraftforge.gradle') {
        def qa = project.sourceSets.create('lunarSeedQa') {
            java.srcDir(project.file('qa/retrofit-lunar-seed/src/main/java'))
            resources.srcDir(project.file('qa/retrofit-lunar-seed/src/main/resources'))
            compileClasspath = project.sourceSets.main.compileClasspath
        }
        project.tasks.register('lunarSeedQaJar', Jar) {
            archiveBaseName = 'starbridge-lunar-seed-probe'
            archiveVersion = '0.1.0'
            from qa.output
            dependsOn qa.classesTaskName
            destinationDirectory = project.layout.buildDirectory.dir('qa/lunar-seed')
            manifest.attributes('MixinConfigs': 'starbridge-lunar-seed-probe.mixins.json')
        }
        project.reobf.create('lunarSeedQaJar') {
            classpath.from(qa.compileClasspath)
        }
    }
}
