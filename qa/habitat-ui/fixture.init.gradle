gradle.beforeProject { project ->
    project.pluginManager.withPlugin('net.minecraftforge.gradle') {
        def qa = project.sourceSets.create('habitatUiQa') {
            java.srcDir(project.file('qa/habitat-ui/src/main/java'))
            resources.srcDir(project.file('qa/habitat-ui/src/main/resources'))
            compileClasspath = project.sourceSets.main.compileClasspath + project.sourceSets.main.output
        }
        project.tasks.register('habitatUiQaJar', Jar) {
            archiveBaseName = 'starbridge-habitat-ui'
            manifest.attributes('MixinConfigs': 'starbridge-habitat-qa.mixins.json')
            archiveVersion = '0.1.0'
            from qa.output
            dependsOn qa.classesTaskName
            destinationDirectory = project.layout.buildDirectory.dir('qa/habitat-ui')
        }
        project.reobf.create('habitatUiQaJar') {
            classpath.from(qa.compileClasspath)
        }
    }
}
