gradle.beforeProject { project ->
    project.pluginManager.withPlugin('net.minecraftforge.gradle') {
        def qa = project.sourceSets.create('homeBerthQa') {
            java.srcDir(project.file('qa/home-berths/src/main/java'))
            resources.srcDir(project.file('qa/home-berths/src/main/resources'))
            compileClasspath = project.sourceSets.main.compileClasspath + project.sourceSets.main.output
        }
        project.tasks.register('homeBerthQaJar', Jar) {
            archiveBaseName = 'starbridge-home-berths'
            archiveVersion = '0.1.0'
            manifest.attributes('MixinConfigs': 'starbridge-landing-profile.mixins.json')
            from qa.output
            dependsOn qa.classesTaskName
            destinationDirectory = project.layout.buildDirectory.dir('qa/home-berths')
        }
        project.reobf.create('homeBerthQaJar') {
            classpath.from(qa.compileClasspath)
        }
    }
}
